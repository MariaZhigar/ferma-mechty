<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7ec8ea" />
    <title>Ферма Мечты</title>
    <style>
      :root {
        color: #5d3a1a;
        background: #c5e6f7;
        font-family: Nunito, 'Segoe UI', sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        max-width: 28rem;
        background: #fff8e8;
        border: 3px solid #c47a3a;
        border-radius: 24px;
        padding: 28px 24px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
      }
      p {
        margin: 0 0 12px;
        line-height: 1.45;
      }
      p:last-child {
        margin-bottom: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Ферма Мечты</h1>
      <p>
        Игра ещё не сохранилась на этом устройстве. Откройте её один раз при наличии сети — после
        этого она запускается без интернета.
      </p>
      <p>
        The game is not cached on this device yet. Open it once while online, and later it will
        start without a connection.
      </p>
    </main>
  </body>
</html>
